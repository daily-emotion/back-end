version: '3.7'

services:
  redis:
    image: redis:latest
    container_name: daily-emotion-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped

  mariadb:
    image: mariadb:latest
    container_name: daily-emotion
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}   # root 비밀번호 설정
      MARIADB_DATABASE: daily_emotion_db  # 기본 데이터베이스 생성
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db/initdb.d:/docker-entrypoint-initdb.d  # 초기화 스크립트 경로 마운트
    networks:
      - app-network
    restart: unless-stopped

volumes:
  redis-data:
    name: daily-emotion-redis-data
  mariadb-data:
    name: daily-emotion-data

networks:
  app-network:
    name: daily-emotion-network
    driver: bridge