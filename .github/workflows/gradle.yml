name: sparkle-note-deploy

on:
  push:
    branches: [ "dev" , "main"]

jobs:
  deploy:
    name: spring boot server ci-cd
    runs-on: ubuntu-latest

    steps:
      # 1. 체크아웃 (dev나 main의 코드를 워크플로우로 가져옴)
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 설정 (JDK 21 버전)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 빌드 (테스트 포함)
      - name: Build
        run: ./gradlew build -x test

      # 4. 빌드된 .jar 파일과 환경 변수 파일을 GCP로 전송
      - name: Upload .jar and .env files to GCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          source: "build/libs/*.jar, dockerfile, docker-compose-prod.yml, env/common.env, env/prod.env"
          target: "~/daily-emotion"

      # 5. GCP에서 Docker Compose로 컨테이너 갱신
      - name: Restart application with Docker Compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            cd ~/daily-emotion
            echo "Restarting Docker containers..."
            export SPRING_PROFILES_ACTIVE=prod
            export PATH=$PATH:/usr/local/bin

            # env 파일이 제대로 업로드되었는지 확인
            ls -lah env/
            cat env/common.env || echo "⚠️ common.env 파일이 없습니다!"
            cat env/prod.env || echo "⚠️ prod.env 파일이 없습니다!"

            # Docker 실행
            docker-compose -f docker-compose-prod.yml down
            docker rmi daily-emotion-backend
            docker-compose -f docker-compose-prod.yml up --build -d
