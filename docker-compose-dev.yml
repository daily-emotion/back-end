version: '3.7'

services:
  backend:
    environment:
      - SPRING_PROFILES_ACTIVE=dev, oauth # application-prod.yml을 자동으로 적용
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/daily_emotion
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daily-emotion-backend
    ports:
      - "8080:8080"
    env_file:
      - ./env/common.env
      - ./env/dev.env
    networks:
      - app-network
    restart: no
  redis:
    image: redis:latest
    container_name: daily-emotion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped
  mariadb:
    image: mariadb:latest
    container_name: daily-emotion-mariadb
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db/initdb.d:/docker-entrypoint-initdb.d  # 초기화 스크립트 경로 마운트
    networks:
      - app-network
    restart: unless-stopped

volumes:
  redis-data:
    name: daily-emotion-redis-data
  mariadb-data:
    name: daily-emotion-data

networks:
  app-network:
    name: daily-emotion-network
    driver: bridge