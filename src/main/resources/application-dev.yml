spring:
  config:
    import:
      - optional:file:./env/common.env[common]
      - optional:file:./env/dev.env[prod]
      - optional:classpath:application-oauth.yml
  application:
    name: daily-emotion
  profiles:
    group:
      dev:
        - oauth
      prod:
        - oauth

  # 데이터베이스 설정
  datasource:
    url: jdbc:mariadb://daily-emotion-mariadb:3306/daily_emotion
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}