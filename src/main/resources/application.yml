spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: daily-emotion

server:
  servlet:
    context-path: /api

firebase:
  config:
    path: firebaseServiceAccountKey.json

jwt:
  secret: ${JWT_SECRET}
  accessExpiration: ${JWT_ACCESS_EXPIRATION}
  refreshExpiration: ${JWT_REFRESH_EXPIRATION}