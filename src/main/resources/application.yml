spring:
  config:
    import:
      - optional:file:env/common.env
      - optional:file:env/dev.env[dev]
      - optional:file:env/prod.env[prod]
  application:
    name: daily-emotion
  profiles:
    group:
      dev:
        - oauth
      prod:
        - oauth
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  datasource:
    url: jdbc:mariadb://localhost:3306/daily_emotion_db
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver
    jpa:
      hibernate:
        ddl-auto: update
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MariaDBDialect

server:
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}
  accessExpiration: ${JWT_ACCESS_EXPIRATION}
  refreshExpiration: ${JWT_REFRESH_EXPIRATION}