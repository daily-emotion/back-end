spring:
  application:
    name: daily-emotion

  # 환경 변수 로드 (공통 + 환경별 추가 로드)
  config:
    import:
      - optional:file:.env.common
      - optional:file:.env.${SPRING_PROFILES_ACTIVE}

  # 프로필 그룹 설정 - OAuth 관련 프로필 연결
  profiles:
    group:
      local:
        - oauth
      prod:
        - oauth

  # 데이터베이스 기본 설정
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA 설정
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: none
    show-sql: true

  # Redis 기본 설정 (환경별 덮어쓰기 가능)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT}

# API 경로 설정
server:
  servlet:
    context-path: /api

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  accessExpiration: ${JWT_ACCESS_EXPIRATION}
  refreshExpiration: ${JWT_REFRESH_EXPIRATION}

# Swagger 설정
springdoc:
  swagger-ui:
    operations-sorter: get-post-put-delete
    tagsSorter: alpha

# 로깅 기본 설정
logging:
  level:
    org.springframework.security: DEBUG
