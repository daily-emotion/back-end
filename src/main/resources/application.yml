spring:
  application:
    name: daily-emotion
  # 환경 변수 파일 가져오기 설정 추가
  config:
    import:
      - optional:file:./env/common.env
      - optional:file:./env/prod.env[prod]
  # 프로필 그룹 설정 - OAuth 관련 프로필 연결
  profiles:
    group:
      dev:
        - oauth
      prod:
        - oauth
  # 데이터베이스 설정
  datasource:
    url: jdbc:mariadb://localhost:3306/daily_emotion
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # JPA 설정
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: none
    show-sql: true

# API 경로 설정
server:
  servlet:
    context-path: /api

# JWT 설정 - 환경 변수 사용
jwt:
  secret: ${JWT_SECRET}
  accessExpiration: ${JWT_ACCESS_EXPIRATION}
  refreshExpiration: ${JWT_REFRESH_EXPIRATION}

# Swagger UI 설정
springdoc:
  swagger-ui:
    operations-sorter: get-post-put-delete
    tagsSorter: alpha

# 로깅 설정
logging:
  level:
    org.springframework.security: DEBUG