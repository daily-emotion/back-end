spring:
  config:
    activate:
      on-profile: local

  # 개발용 MariaDB 설정
  datasource:
    url: jdbc:mariadb://localhost:3306/daily_emotion

  # Redis (로컬 개발용)
  data:
    redis:
      host: localhost
      port: 6379
      password: ""

# 로깅 설정 (개발용)
logging:
  level:
    org.hibernate.SQL: debug
    org.springframework: debug
