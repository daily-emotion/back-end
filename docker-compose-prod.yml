version: '3.7'
services:
  backend:
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daily-emotion-backend
    ports:
      - "8080:8080"
    env_file:
      - ./env/common.env
      - ./env/prod.env
    depends_on:
      - mariadb
      - redis
    networks:
      - app-network
    restart: unless-stopped  # 운영 환경에서는 자동 재시작이 중요

  redis:
    image: redis:latest
    container_name: daily-emotion-redis
    expose:
      - "6379"  # 내부 네트워크에서만 접근 가능
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped

  mariadb:
    image: mariadb:latest
    container_name: daily-emotion-mariadb
    expose:
      - "3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: daily_emotion
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db/initdb.d:/docker-entrypoint-initdb.d
    networks:
      - app-network
    restart: unless-stopped