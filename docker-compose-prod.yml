version: '3.7'
services:
  backend:
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://daily-emotion-mariadb:3306/daily_emotion
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daily-emotion-backend
    ports:
      - "8080:8080"
    env_file:
      - ./env/common.env
      - ./env/prod.env
    depends_on:
      - mariadb
      - redis
    networks:
      - app-network
    restart: no

  redis:
    image: redis:latest
    container_name: daily-emotion-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: no

  mariadb:
    image: mariadb:latest
    container_name: daily-emotion-mariadb
    expose:
      - "3306"
    environment:
      MARIADB_ROOT_PASSWORD: 1234
      MARIADB_DATABASE: daily_emotion
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db/initdb.d:/docker-entrypoint-initdb.d
    networks:
      - app-network
    restart: no

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
  mariadb-data: